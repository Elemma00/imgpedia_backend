name: Build and Deploy ImgPedia Backend

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t elemma00/imgpedia_backend:latest .
          docker push elemma00/imgpedia_backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event.pusher && contains(fromJson('["OWNER","COLLABORATOR"]'), github.event.sender.type)
    steps:
      - name: Copia clave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy en servidor remoto
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            cd /home/efaundez/imgpedia_backend &&
            docker compose pull &&
            docker compose up -d
          '
