spring.application.name=imgpedia_backend
server.port=8081

springdoc.api-docs.enabled=true

# Configuring size for file uploads
spring.servlet.multipart.max-file-size=500GB
spring.servlet.multipart.max-request-size=500GB


# JWT configuration
jwt.secret=imgpediaSecretKeyMustBeAtLeast32CharactersLong
jwt.expiration=86400000

# Configuration for PostgreSQL database (for production purposes)
spring.datasource.url=jdbc:postgresql://db:5432/imgpedia_users
spring.datasource.username=imgpedia
spring.datasource.password=imgpedia_secure_password
# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update


server.tomcat.max-swallow-size=-1
spring.mvc.async.request-timeout=-1

logging.level.org.springframework.web=INFO
logging.level.com.imgpedia.imgpedia_backend=INFO

# Configuring logging for the application
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.path=/app/logs
logging.file.name=${logging.file.path}/imgpedia_backend.log
logging.logback.rollingpolicy.file-name-pattern=${logging.file.path}/imgpedia_backend.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
logging.logback.rollingpolicy.clean-history-on-start=false