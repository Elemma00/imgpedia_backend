spring.application.name=imgpedia_backend
server.port=8081

springdoc.api-docs.enabled=true

# Configuring size for file uploads
spring.servlet.multipart.max-file-size=500GB
spring.servlet.multipart.max-request-size=500GB

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Configuration for PostgreSQL database (for production purposes)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}

admin=${ADMIN}
password=${PASSWORD}

server.tomcat.max-swallow-size=-1
spring.mvc.async.request-timeout=-1

logging.level.org.springframework.web=INFO
logging.level.com.imgpedia.imgpedia_backend=INFO

# Configuring logging for the application
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.path=/app/logs
logging.file.name=${logging.file.path}/imgpedia_backend.log
logging.logback.rollingpolicy.file-name-pattern=${logging.file.path}/imgpedia_backend.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
logging.logback.rollingpolicy.clean-history-on-start=false