version: "3.9"

services:
  imgpedia_backend:
    container_name: imgpedia_backend_container 
    build: .
    image: elemma00/imgpedia_backend:latest
    restart: unless-stopped
    pull_policy: always
    environment:
      - TDB_PATH=${TDB_PATH}
      - JAVA_OPTS=${JAVA_OPTS}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - ADMIN=${ADMIN}
      - PASSWORD=${PASSWORD}
    volumes:
      - /home/efaundez:/home/efaundez
      - /NAS/sferrada/imgpedia/imgpedia_tdb:/imgpedia_tdb
      - /NAS/sferrada:/nas_mount
      - /NAS/sferrada/imgpedia/resource:/nas_mount/imgpedia/resource
      - /NAS/sferrada/imgpedia/logs:/app/logs
      - /NAS/sferrada/imgpedia/temp_extraction:/imgpedia/temp_extraction
    ports:
      - "8081:8081"
    user: "1014:1003" # UID efaundez : GID del grupo sfc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    cpu_shares: 4096  

  db:
    image: postgres:14-alpine
    container_name: imgpedia_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imgpedia -d imgpedia_users"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
